name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Build App
        # Use Release configuration and put outputs in a known directory
        run: |
          xcodebuild -scheme spac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Sign App
        run: |
          codesign --force --deep --sign - "build/Build/Products/Release/spac.app"
          codesign --verify --deep --strict --verbose=2 "build/Build/Products/Release/spac.app"
            
      - name: Compress App
        # Navigate to the build output and zip the .app bundle
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent spac.app ../../../../spac.zip
          
      - name: Install create-dmg
        run: brew install create-dmg
          
      - name: Create DMG
        run: |
          create-dmg \
            --volname "spac" \
            --volicon "assets/logo.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "spac.app" 175 190 \
            --hide-extension "spac.app" \
            --app-drop-link 425 190 \
            "spac.dmg" \
            "build/Build/Products/Release/spac.app"

      - name: Generate Sparkle Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing SPARKLE_PRIVATE_KEY secret"
            exit 1
          fi

          mkdir -p release-assets
          cp spac.dmg release-assets/spac.dmg

          echo "$SPARKLE_PRIVATE_KEY" | \
            build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "$DOWNLOAD_URL_PREFIX" \
              --link "https://github.com/${{ github.repository }}" \
              release-assets
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            spac.zip
            spac.dmg
            release-assets/appcast.xml
          draft: true
          prerelease: false
          generate_release_notes: true
