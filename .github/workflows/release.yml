name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: macos-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Newest Xcode
        # The Liquid Glass HUD compiles its native `glassEffect` path only with
        # the Xcode 26 (Swift 6.2) SDK. Pick the highest Xcode the runner has so
        # releases ship native glass when available; older runners fall back to
        # the legacy glass path via the `#if compiler(>=6.2)` guard.
        run: |
          LATEST_XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          echo "Selecting ${LATEST_XCODE}"
          sudo xcode-select -s "${LATEST_XCODE}/Contents/Developer"
          xcodebuild -version

      - name: Verify Tag Matches Project Version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH, got ${GITHUB_REF_NAME}"
            exit 1
          fi

          PROJECT_VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION = \([^;]*\);$/\1/p' spac.xcodeproj/project.pbxproj | head -n 1)"
          PROJECT_BUILD="$(sed -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION = \([^;]*\);$/\1/p' spac.xcodeproj/project.pbxproj | head -n 1)"

          if [[ "$PROJECT_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match MARKETING_VERSION ${PROJECT_VERSION}"
            exit 1
          fi

          if [[ ! "$PROJECT_BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::CURRENT_PROJECT_VERSION must be an integer, got ${PROJECT_BUILD}"
            exit 1
          fi
      
      - name: Build App
        # Use Release configuration and put outputs in a known directory
        run: |
          xcodebuild -scheme spac \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_IDENTITY="" \
            CODE_SIGN_STYLE=Manual

      - name: Sign App
        run: |
          codesign --force --deep --sign - "build/Build/Products/Release/spac.app"
          codesign --verify --deep --strict --verbose=2 "build/Build/Products/Release/spac.app"
            
      - name: Compress App
        # Navigate to the build output and zip the .app bundle
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent spac.app ../../../../spac.zip
          
      - name: Install create-dmg
        run: brew install create-dmg
          
      - name: Create DMG
        run: |
          create-dmg \
            --volname "spac" \
            --volicon "assets/logo.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "spac.app" 175 190 \
            --hide-extension "spac.app" \
            --app-drop-link 425 190 \
            "spac.dmg" \
            "build/Build/Products/Release/spac.app"

      - name: Generate Sparkle Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
        run: |
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing SPARKLE_PRIVATE_KEY secret"
            exit 1
          fi

          mkdir -p release-assets
          cp spac.dmg release-assets/spac.dmg

          echo "$SPARKLE_PRIVATE_KEY" | \
            build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "$DOWNLOAD_URL_PREFIX" \
              --link "https://github.com/${{ github.repository }}" \
              release-assets
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            spac.zip
            spac.dmg
            release-assets/appcast.xml
          draft: false
          prerelease: false
          generate_release_notes: true
